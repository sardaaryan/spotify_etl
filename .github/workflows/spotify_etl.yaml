name: Spotify Daily ETL

on:
  schedule:
    - cron: '17 4 * * *' 
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache DuckDB Database (State Management)
        uses: actions/cache@v3
        with:
          path: data/spotify_warehouse.db
          key: duckdb-state-${{ github.run_id }}
          restore-keys: |
            duckdb-state-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Extraction & Load (Pipeline)
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REDIRECT_URI: ${{ secrets.SPOTIFY_REDIRECT_URI }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python src/pipeline.py

      - name: Generate Analytics Payload (Publish)
        run: python src/publish.py

      # --- THIS IS THE NEW REPLACED STEP ---
      - name: Pushing stats.json to Portfolio Repo
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.PORTFOLIO_REPO_TOKEN }}
        with:
          source_file: 'data/stats.json'
          destination_repo: 'sardaaryan/portfolio' # 👈 Replace with your actual username/repo
          destination_folder: 'data'
          user_email: 'github-actions@github.com'
          user_name: 'spotify-etl-bot'
          commit_message: 'Update Spotify stats from ETL pipeline'
          destination_branch: 'main'