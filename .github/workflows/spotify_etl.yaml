name: Spotify Daily ETL

on:
  schedule:
    # This runs at 8:34 AM and 8:34 PM UTC
    - cron: '34 8,20 * * *'
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Generate Weekly Rotation Variables
      - name: Set Date Variables
        run: |
          echo "CURRENT_YEAR=$(date +'%G')" >> $GITHUB_ENV
          echo "CURRENT_WEEK=$(date +'%V')" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 2. Use Weekly Rotating Cache Key
      # v2 prefix ignores your old 7-column database schema
      - name: Cache DuckDB Database (Weekly Rotation)
        uses: actions/cache@v3
        with:
          path: data/spotify_warehouse.db
          key: duckdb-v2-${{ env.CURRENT_YEAR }}-${{ env.CURRENT_WEEK }}-${{ github.run_id }}
          restore-keys: |
            duckdb-v2-${{ env.CURRENT_YEAR }}-${{ env.CURRENT_WEEK }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Extraction & Load (Pipeline)
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REDIRECT_URI: ${{ secrets.SPOTIFY_REDIRECT_URI }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python src/pipeline.py

      - name: Generate Analytics Payload (Publish)
        run: python src/publish.py

      - name: Pushing stats.json to Portfolio Repo
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.PORTFOLIO_REPO_TOKEN }}
        with:
          source_file: 'data/stats.json'
          destination_repo: 'sardaaryan/portfolio'
          destination_folder: 'data'
          user_email: 'github-actions@github.com'
          user_name: 'spotify-etl-bot'
          commit_message: 'Update Spotify stats from ETL pipeline [Weekly Reset]'
          destination_branch: 'main'